name: Scopehaven drift (scheduled)

# Re-run the regression gate on a built-in synthetic target on a schedule and
# write a job summary with drift against the last successful run, kept in the Actions cache.
# No external target, no secrets, no notifications: the job summary is the only output.
# workflow_dispatch can plant a regression: demo-vulnerable against a cached demo-repaired run.

# GitHub pauses a scheduled workflow after 60 days without repository activity; re-enable it from the Actions tab.
on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:
    inputs:
      target:
        description: Built-in target (demo-vulnerable against a cached demo-repaired run plants a regression)
        required: false
        default: demo-repaired
        type: choice
        options:
          - demo-repaired
          - demo-vulnerable

permissions:
  contents: read

concurrency:
  group: scopehaven-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Restore the last successful run
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .scopehaven-drift/last-run.json
          key: scopehaven-drift-${{ github.run_id }}
          restore-keys: scopehaven-drift-

      - name: Gate against the last successful run and write the drift summary
        env:
          SH_TARGET: ${{ inputs.target || 'demo-repaired' }}
          SH_DRIFT_DIR: ${{ github.workspace }}/.scopehaven-drift
        run: |
          set +e
          SCOPEHAVEN_DRIFT_DIR="$SH_DRIFT_DIR" bash integrations/schedule/run-local.sh "$SH_TARGET"
          code=$?
          if [ -f "$SH_DRIFT_DIR/latest-drift.md" ]; then cat "$SH_DRIFT_DIR/latest-drift.md" >> "$GITHUB_STEP_SUMMARY"; fi
          echo "Scopehaven drift exit code: $code"
          exit "$code"

      - name: Keep this run as the next baseline
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .scopehaven-drift/last-run.json
          key: scopehaven-drift-${{ github.run_id }}
